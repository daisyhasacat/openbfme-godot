# Include inside secondage.dev's existing TLS server block.
# Its exact /v1/sync location keeps precedence over this prefix.
location = /online { return 302 /online/; }
location /online/ { include /etc/nginx/snippets/openbfme-online-proxy.conf; }
location /web/ { include /etc/nginx/snippets/openbfme-online-proxy.conf; }
# Management is available only through the passkey gateway on the admin origin.
location = /v1/admin { return 404; }
location ^~ /v1/admin/ { return 404; }
location /v1/ {
    client_max_body_size 65m;
    include /etc/nginx/snippets/openbfme-online-proxy.conf;
}
location /j/ { include /etc/nginx/snippets/openbfme-online-proxy.conf; }
location = /healthz { include /etc/nginx/snippets/openbfme-online-proxy.conf; }
