# Include only inside admin.secondage.dev's existing TLS server block.
# Existing / and /api/* stay with the established passkey authenticator.
location = /online { return 302 /online/; }
location /online/ { include /etc/nginx/snippets/openbfme-online-admin-proxy.conf; }
location /web/ { include /etc/nginx/snippets/openbfme-online-admin-proxy.conf; }
location /v1/ { include /etc/nginx/snippets/openbfme-online-admin-proxy.conf; }
