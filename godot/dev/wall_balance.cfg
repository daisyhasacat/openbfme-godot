[starting_gates]
Mordor="Command_MordorWallUpgradeToRegularGate"
Men="Command_MenWallUpgradeToRegularGate"
Elves="Command_ElvenWallUpgradeToRegularGate"
Dwarves="Command_DwarvenWallUpgradeToRegularGate"
Isengard="Command_IsengardWallUpgradeToRegularGate"
Angmar="Command_AngmarWallUpgradeToRegularGate"

; Client-only automatic terrain inside completed wall enclosures.
[paving]
enabled=true
texture="CobblestoneType2"
tile_size=80.0
