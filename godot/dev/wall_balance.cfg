; BFME2Lua wall profile. Saved overrides: user://wall_balance.cfg. Restart match after changes.
[walls]
enabled=true
new_towers=true
wall_damage=1
fortress_damage=1
intermediate_hubs=false
trebuchet_wall_targets=false
share_arrows=true
starting_walls=false
require_enclosed=true
gate_gap=false
enclosed_income=2.0
starting_radius=450.0
starting_spacing=300.0
wall_health=6.0
hub_health=30.0
